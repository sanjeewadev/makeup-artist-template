name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure CI Payload secret
        run: echo "PAYLOAD_SECRET=ci-validation-only" > .env

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

  chat1-schema-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Validate Chat 1 Payload foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure CI Payload secret
        run: echo "PAYLOAD_SECRET=chat1-ci-generation-only" > .env

      - name: Generate Payload types
        run: pnpm generate:types:payload

      - name: Generate D1 migration
        run: pnpm payload migrate:create chat1-foundation

      - name: Lint generated schema
        run: pnpm lint

      - name: Type check generated schema
        run: pnpm exec tsc --noEmit

      - name: Commit generated schema artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts src/migrations
          if git diff --cached --quiet; then
            echo "No generated schema changes."
          else
            git commit -m "chore: sync Payload schema artifacts"
            git push origin HEAD:dev
          fi
