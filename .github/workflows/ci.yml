name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure CI Payload secret
        run: printf "PAYLOAD_SECRET=ci-validation-only\\nCLOUDFLARE_REMOTE_BINDINGS=false\\n" > .env

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          CLOUDFLARE_REMOTE_BINDINGS: 'false'
